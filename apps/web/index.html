<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d365d" />
    <title>PASI — Painel do profissional</title>
    <script>
      // Tema antes da primeira pintura (evita o flash): escolha salva ou preferência do sistema.
      (function () {
        var t = null;
        try { t = localStorage.getItem('pasi-tema'); } catch (e) {}
        var escuro = t === 'escuro' || (t !== 'claro' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', escuro ? 'dark' : 'light');
        // Preferências de acessibilidade (lib/acessibilidade.ts), também antes da primeira pintura.
        try {
          var a = JSON.parse(localStorage.getItem('pasi-a11y') || 'null');
          var c = document.documentElement.classList;
          if (a && (a.fonte === 1 || a.fonte === 2)) c.add('a11y-font-' + a.fonte);
          if (a && a.contraste) c.add('a11y-contraste');
          if (a && a.pretoBranco) c.add('a11y-pb');
          if (a && a.movimento) c.add('a11y-movimento');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
